server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/brightconnect.access.log;
    error_log  /var/log/nginx/brightconnect.error.log;

    client_max_body_size 32m;   # console file attachments

    # --- the product the fleet maintains, previewable from the dashboard ---
    location /app/api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The chat streams its reply; buffering makes it look frozen.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 10m;
    }

    location /app/ {
        alias /opt/brightconnect/product/frontend/dist/;
        try_files $uri $uri/ /app/index.html;
    }

    # --- server-sent events: mission activity, and console replies ---
    location ~ ^/api/(stream|console/chat)$ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Without buffering off and a long read timeout, nginx holds the stream
        # and the console looks frozen mid-mission.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # --- the dashboard ---
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A mission runs for minutes; do not cut the request short.
        proxy_read_timeout 10m;
    }
}
